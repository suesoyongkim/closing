<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>마감 정산</title>
  <style>
    :root { color-scheme:light; --ink:#161616; --muted:#777; --line:#e9e9e9; --field:#f7f7f7; }
    * { box-sizing:border-box; }
    html { -webkit-text-size-adjust:100%; }
    body { margin:0; background:#fff; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; letter-spacing:-.025em; }
    button,input,textarea { font:inherit; }
    button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
    button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible { outline:2px solid #999; outline-offset:2px; }
    .app { width:100%; max-width:520px; margin:auto; padding:calc(36px + env(safe-area-inset-top)) 22px calc(115px + env(safe-area-inset-bottom)); }
    .hero { padding:0 0 27px; }
    .eyebrow { display:none; }
    h1 { font-size:28px; font-weight:760; letter-spacing:-.055em; line-height:1.2; margin:0 0 7px; }
    .hero-desc { margin:0 0 28px; color:var(--muted); font-size:13px; }
    .date-wrap { display:flex; align-items:center; gap:10px; }
    .date-label { display:none; }
    input[type=date] { appearance:none; -webkit-appearance:none; min-width:0; flex:1; width:100%; height:48px; border:1px solid #dedede; border-radius:8px; padding:0 12px; background:#fff; color:var(--ink); font-size:15px; font-weight:580; color-scheme:light; }
    input[type=date]::-webkit-calendar-picker-indicator { opacity:.7; }
    .today-button { height:48px; min-width:62px; padding:0 14px; border:1px solid #dedede; border-radius:8px; color:#222; background:#f5f5f5; font-size:14px; font-weight:650; }
    .today-button:active { background:#ebebeb; }
    .auto-status { display:flex; align-items:center; gap:7px; margin:11px 1px 0; font-size:11px; color:#8a8a8a; }
    .dot { height:6px; width:6px; background:#aaa; border-radius:50%; flex:0 0 auto; }
    .section { padding:25px 0 28px; border-top:1px solid var(--line); }
    .section-title { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
    h2 { font-size:17px; line-height:1.35; font-weight:730; letter-spacing:-.04em; margin:0; }
    .hint,.count-chip { font-size:11px; color:#999; font-weight:500; white-space:nowrap; }
    .field-grid,.photo-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 11px; }
    .field { display:flex; min-width:0; flex-direction:column; gap:7px; }
    .field-label { color:#666; font-size:12px; font-weight:550; }
    .input-holder { display:flex; align-items:center; gap:5px; min-height:48px; background:var(--field); border:1px solid #f0f0f0; border-radius:8px; padding:0 11px; }
    .input-holder:focus-within { border-color:#aaa; background:#fff; }
    .input-holder input { width:100%; min-width:0; padding:12px 0; border:0; outline:0; background:transparent; color:#111; font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; }
    .input-holder input::placeholder { color:#bbb; }
    .unit { color:#999; font-size:11px; flex:0 0 auto; }
    .total { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:23px; border-top:1px solid var(--line); padding-top:20px; }
    .total span { font-size:14px; font-weight:650; }
    .total strong { text-align:right; font-size:24px; font-weight:770; letter-spacing:-.045em; font-variant-numeric:tabular-nums; }
    .subrule { height:1px; background:var(--line); margin:26px 0 24px; }
    textarea { display:block; width:100%; min-height:84px; resize:vertical; padding:13px; border:1px solid #eee; background:var(--field); border-radius:8px; outline:0; color:#111; line-height:1.6; font-size:14px; }
    textarea:focus { border-color:#aaa; background:#fff; }
    textarea::placeholder { color:#aaa; }
    .report-card { padding:0 0 10px; border-top:1px solid var(--line); }
    .report-head { list-style:none; display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; padding:21px 0; }
    .report-head::-webkit-details-marker { display:none; }
    .report-head h2 { font-size:14px; font-weight:650; }
    .pill { color:#999; font-size:12px; }
    .report-card[open] .pill { display:none; }
    .report-card[open] .report-head { border-bottom:1px solid var(--line); }
    pre { padding:18px 1px 23px; margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font:13px/1.9 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; color:#454545; user-select:text; -webkit-user-select:text; }
    details.history { border-top:1px solid var(--line); margin-top:8px; }
    details.history summary { display:flex; align-items:center; gap:4px; list-style:none; cursor:pointer; padding:20px 0; color:#666; font-size:13px; font-weight:600; }
    details.history summary::-webkit-details-marker { display:none; }
    details.history summary::after { content:'⌄'; margin-left:auto; font-size:18px; font-weight:400; }
    details.history[open] summary::after { transform:rotate(180deg); }
    .history-list { border-top:1px solid var(--line); padding:8px 0 12px; }
    .history-row { display:flex; align-items:center; gap:10px; padding:6px 0; }
    .history-open { text-align:left; flex:1; padding:10px 11px; border:1px solid #eee; border-radius:7px; background:#fafafa; font-size:13px; font-weight:600; color:#222; }
    .history-open small { display:block; font-size:11px; color:#777; margin-top:3px; font-weight:400; }
    .history-delete { padding:10px 4px; background:none; border:0; font-size:12px; color:#999; }
    .no-history { color:#999; font-size:12px; padding:12px 0; }
    .foot-help { margin:17px 0 0; color:#a0a0a0; font-size:11px; line-height:1.7; text-align:center; }
    .bottom-bar { position:fixed; z-index:10; bottom:0; left:0; right:0; padding:12px max(22px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left)); border-top:1px solid #eee; background:rgba(255,255,255,.97); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
    .bottom-inner { max-width:476px; display:flex; gap:9px; margin:auto; }
    .reset { padding:0 16px; height:51px; color:#555; background:#f5f5f5; border:1px solid #eee; border-radius:8px; font-weight:600; font-size:13px; }
    .copy { flex:1; min-height:51px; border:0; border-radius:8px; background:#171717; color:#fff; font-size:15px; font-weight:710; }
    .copy:active { background:#383838; }
    #toast { position:fixed; z-index:20; left:50%; bottom:calc(92px + env(safe-area-inset-bottom)); transform:translate(-50%,10px); max-width:calc(100vw - 30px); padding:11px 15px; background:#222; color:#fff; border-radius:8px; opacity:0; pointer-events:none; font-size:12px; text-align:center; white-space:nowrap; transition:opacity .16s,transform .16s; }
    #toast.show { opacity:1; transform:translate(-50%,0); }
    @media (max-width:360px) { .app { padding-left:16px; padding-right:16px; } .bottom-bar { padding-left:16px; padding-right:16px; } .field-grid,.photo-grid { column-gap:9px; } .input-holder { padding:0 9px; } }
    @media (prefers-reduced-motion:reduce) { *,*:before,*:after { transition:none!important; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>마감 정산</h1>
      <p class="hero-desc">정산 날짜와 숫자를 입력하고 복사하세요.</p>
      <div class="date-wrap">
        <label class="date-label" for="reportDate">정산 날짜</label>
        <input type="date" id="reportDate" aria-label="정산 날짜">
        <button type="button" class="today-button" id="todayButton" aria-label="정산 날짜를 오늘로 변경">오늘</button>
      </div>
      <div class="auto-status"><span class="dot"></span><span id="saveStatus">이 기기에 자동 저장돼요</span></div>
    </header>

    <section class="section" aria-labelledby="sales-title">
      <div class="section-title"><h2 id="sales-title">매출보고</h2><span class="hint">원 단위 입력</span></div>
      <div class="field-grid">
        <label class="field"><span class="field-label">카드</span><span class="input-holder"><input type="text" inputmode="numeric" data-key="card" placeholder="0" autocomplete="off" aria-label="카드 매출"><span class="unit">원</span></span></label>
        <label class="field"><span class="field-label">현금</span><span class="input-holder"><input type="text" inputmode="numeric" data-key="cash" placeholder="0" autocomplete="off" aria-label="현금 매출"><span class="unit">원</span></span></label>
        <label class="field"><span class="field-label">상품권</span><span class="input-holder"><input type="text" inputmode="numeric" data-key="voucher" placeholder="0" autocomplete="off" aria-label="상품권 매출"><span class="unit">원</span></span></label>
        <label class="field"><span class="field-label">환불</span><span class="input-holder"><input type="text" inputmode="numeric" data-key="refund" placeholder="0" autocomplete="off" aria-label="환불 금액"><span class="unit">원</span></span></label>
      </div>
      <div class="total" aria-live="polite"><span>총 매출</span><strong id="grandTotal">0원</strong></div>
    </section>

    <section class="section" aria-labelledby="photo-title">
      <div class="section-title"><h2 id="photo-title">촬영내역</h2><span class="count-chip" id="photoTotal">총 0건</span></div>
      <div class="photo-grid">
        <label class="field"><span class="field-label">증명사진</span><span class="input-holder"><input type="text" inputmode="numeric" data-key="idPhoto" placeholder="—" autocomplete="off"><span class="unit">건</span></span></label>
        <label class="field"><span class="field-label">여권사진</span><span class="input-holder"><input type="text" inputmode="numeric" data-key="passport" placeholder="—" autocomplete="off"><span class="unit">건</span></span></label>
        <label class="field"><span class="field-label">프로필사진</span><span class="input-holder"><input type="text" inputmode="numeric" data-key="profile" placeholder="—" autocomplete="off"><span class="unit">건</span></span></label>
        <label class="field"><span class="field-label">이미지사진</span><span class="input-holder"><input type="text" inputmode="numeric" data-key="imagePhoto" placeholder="—" autocomplete="off"><span class="unit">건</span></span></label>
        <label class="field"><span class="field-label">셀프사진</span><span class="input-holder"><input type="text" inputmode="numeric" data-key="selfPhoto" placeholder="—" autocomplete="off"><span class="unit">건</span></span></label>
      </div>
      <div class="subrule"></div>
      <div class="section-title"><h2>추가 내역</h2><span class="hint">없으면 비워 두기</span></div>
      <div class="field-grid">
        <label class="field"><span class="field-label">인원 추가 · 1</span><span class="input-holder"><input type="text" inputmode="numeric" data-key="people1" placeholder="—" autocomplete="off"><span class="unit">건</span></span></label>
        <label class="field"><span class="field-label">수정 추가</span><span class="input-holder"><input type="text" inputmode="numeric" data-key="editExtra" placeholder="—" autocomplete="off"><span class="unit">건</span></span></label>
        <label class="field"><span class="field-label">인원 추가 · 2</span><span class="input-holder"><input type="text" inputmode="numeric" data-key="people2" placeholder="—" autocomplete="off"><span class="unit">건</span></span></label>
        <label class="field"><span class="field-label">시간 추가</span><span class="input-holder"><input type="text" inputmode="numeric" data-key="timeExtra" placeholder="—" autocomplete="off"><span class="unit">건</span></span></label>
      </div>
    </section>

    <section class="section" aria-labelledby="note-title">
      <div class="section-title"><h2 id="note-title">특이사항</h2><span class="hint">없으면 '없음'으로 출력</span></div>
      <textarea data-key="note" placeholder="특이사항 입력 (없으면 비워 두세요)"></textarea>
    </section>

    <details class="report-card" aria-labelledby="preview-title">
      <summary class="report-head"><h2 id="preview-title">복사될 내용 미리보기</h2><span class="pill">펼치기 ⌄</span></summary>
      <pre id="preview"></pre>
    </details>

    <details class="history"><summary>이전에 저장한 정산 <span id="historyCount" style="margin-left:5px;color:#999;font-size:11px;font-weight:400"></span></summary><div class="history-list" id="historyList"></div></details>
    <p class="foot-help">날짜별로 자동 저장되며, 다른 날짜를 선택하면 새 양식이 열려요.<br>저장 내용은 현재 브라우저에만 보관됩니다.</p>
  </main>

  <div class="bottom-bar"><div class="bottom-inner"><button class="reset" id="clearButton" type="button">초기화</button><button class="copy" id="copyButton" type="button">전체 복사</button></div></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';
      const PREFIX = 'weeklyCloseout:v1:';
      const keys = ['card','cash','voucher','refund','idPhoto','passport','profile','imagePhoto','selfPhoto','people1','editExtra','people2','timeExtra','note'];
      const amountKeys = ['card','cash','voucher','refund'];
      const photoKeys = ['idPhoto','passport','profile','imagePhoto','selfPhoto'];
      const initial = () => Object.fromEntries(keys.map(k => [k, '']));
      const dateInput = document.getElementById('reportDate');
      const preview = document.getElementById('preview');
      const status = document.getElementById('saveStatus');
      const allInputs = [...document.querySelectorAll('[data-key]')];
      const money = n => Number(n || 0).toLocaleString('ko-KR');
      const num = str => Number(String(str ?? '').replace(/[^0-9]/g, '')) || 0;
      const clean = str => String(str ?? '').replace(/[^0-9]/g, '');
      const dateLabel = iso => {
        const [y,m,d] = iso.split('-').map(Number);
        return `${y}년 ${m}월 ${d}일`;
      };
      const isoLocal = date => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
      let date = isoLocal(new Date());
      let data = initial();
      let toastTimer;
      const load = d => {
        try {
          const saved = JSON.parse(localStorage.getItem(PREFIX+d) || 'null');
          return saved && typeof saved==='object' ? {...initial(), ...saved} : initial();
        } catch { return initial(); }
      };
      const formatInputs = () => allInputs.forEach(el => {
        const k = el.dataset.key;
        el.value = k === 'note' ? data[k] : (data[k] === '' ? '' : money(num(data[k])));
      });
      const reportText = () => {
        const total = num(data.card) + num(data.cash) + num(data.voucher) - num(data.refund);
        const count = k => data[k] === '' ? '' : money(num(data[k]));
        const note = data.note.trim() || '없음';
        return `마감 정산\n\n${dateLabel(date)}\n\n- 매출보고\n\n카드 : ${money(num(data.card))}원\n현금 : ${money(num(data.cash))}원\n상품권 : ${money(num(data.voucher))}원\n\n환불 : ${money(num(data.refund))}원\n\n총 매출 : ${money(total)}원\n\n- 촬영내역\n\n증명사진 : ${count('idPhoto')}\n여권사진 : ${count('passport')}\n프로필사진 : ${count('profile')}\n이미지사진 : ${count('imagePhoto')}\n셀프사진 : ${count('selfPhoto')}\n\n—————————\n인원 추가 : ${count('people1')}\n수정 추가 : ${count('editExtra')}\n인원 추가 : ${count('people2')}\n시간 추가 : ${count('timeExtra')}\n\n- 특이사항\n\n${note}`;
      };
      const render = () => {
        const total = num(data.card) + num(data.cash) + num(data.voucher) - num(data.refund);
        document.getElementById('grandTotal').textContent = money(total) + '원';
        document.getElementById('photoTotal').textContent = '총 ' + money(photoKeys.reduce((a,k) => a+num(data[k]),0)) + '건';
        preview.textContent = reportText();
      };
      const showToast = message => {
        const t=document.getElementById('toast');
        t.textContent=message; t.classList.add('show');
        clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2300);
      };
      const save = () => {
        try { localStorage.setItem(PREFIX+date, JSON.stringify(data)); status.textContent='저장 완료 · 이 기기에 보관됨'; }
        catch { status.textContent='저장 실패 · 브라우저 저장 공간 확인'; showToast('자동 저장이 되지 않았어요'); }
        drawHistory();
      };
      const switchDate = next => {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(next)) return;
        date=next; dateInput.value=next; data=load(next); formatInputs(); render();
        status.textContent='이 기기에 자동 저장돼요';
        drawHistory();
      };
      const drawHistory = () => {
        const dates=[];
        try {
          for (let i=0;i<localStorage.length;i++) { const k=localStorage.key(i); if(k && k.startsWith(PREFIX)) dates.push(k.slice(PREFIX.length)); }
        } catch {}
        dates.sort().reverse();
        document.getElementById('historyCount').textContent=`${dates.length}개`;
        const list=document.getElementById('historyList');
        list.replaceChildren();
        if (!dates.length) { const div=document.createElement('div'); div.className='no-history'; div.textContent='아직 저장된 기록이 없어요.'; list.append(div); return; }
        for (const d of dates) {
          const item=load(d);
          const total=num(item.card)+num(item.cash)+num(item.voucher)-num(item.refund);
          const row=document.createElement('div'); row.className='history-row';
          const open=document.createElement('button'); open.className='history-open'; open.type='button';
          open.textContent=dateLabel(d)+(d===date?' · 현재 보고서':'');
          const detail=document.createElement('small'); detail.textContent=`총 매출 ${money(total)}원`; open.append(detail);
          open.addEventListener('click',()=>{ switchDate(d); window.scrollTo({top:0,behavior:'smooth'}); });
          const del=document.createElement('button'); del.className='history-delete'; del.type='button'; del.textContent='삭제'; del.setAttribute('aria-label',dateLabel(d)+' 기록 삭제');
          del.addEventListener('click',()=>{
            if (!confirm(`${dateLabel(d)} 기록을 삭제할까요?`)) return;
            try { localStorage.removeItem(PREFIX+d); } catch {}
            if(d===date){ data=initial(); formatInputs(); render(); status.textContent='저장된 내용 없음'; }
            drawHistory(); showToast('기록을 삭제했어요');
          });
          row.append(open,del); list.append(row);
        }
      };
      allInputs.forEach(el => {
        const k=el.dataset.key;
        el.addEventListener('input',()=>{
          if(k==='note') data[k]=el.value;
          else {
            data[k]=clean(el.value);
            el.value=data[k] === '' ? '' : money(num(data[k]));
          }
          render(); save();
        });
        if(k!=='note') el.addEventListener('focus',()=>{ if(el.value==='0') el.select(); });
      });
      dateInput.addEventListener('change',()=>switchDate(dateInput.value));
      document.getElementById('todayButton').addEventListener('click',()=>{
        switchDate(isoLocal(new Date()));
      });
      document.getElementById('clearButton').addEventListener('click',()=>{
        if(!confirm(`${dateLabel(date)}의 입력 내용을 모두 초기화할까요?`)) return;
        data=initial(); formatInputs(); render(); save(); showToast('입력 내용을 초기화했어요');
      });
      const copyFallback = str => {
        const temp=document.createElement('textarea');
        temp.value=str; temp.style.position='fixed'; temp.style.opacity='0'; temp.style.top='0';
        document.body.append(temp); temp.focus(); temp.select();
        let ok=false;
        try { ok=document.execCommand('copy'); } catch {}
        temp.remove();
        return ok;
      };
      document.getElementById('copyButton').addEventListener('click',async()=>{
        const text=reportText();
        let copied=false;
        try { if(navigator.clipboard?.writeText) { await navigator.clipboard.writeText(text); copied=true; } } catch {}
        if (!copied) copied=copyFallback(text);
        if(copied){ showToast('복사 완료! 카톡 등에 붙여넣으세요'); const btn=document.getElementById('copyButton'); btn.textContent='✓ 복사 완료'; setTimeout(()=>{btn.textContent='전체 복사';},1800); }
        else { preview.scrollIntoView({behavior:'smooth',block:'center'}); const selection=window.getSelection(); const range=document.createRange(); range.selectNodeContents(preview); selection.removeAllRanges(); selection.addRange(range); showToast('미리보기 글을 길게 눌러 복사해 주세요'); }
      });
      switchDate(date);
    })();
  </script>
</body>
</html>
